<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Task</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .form-section {
            padding: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        input.invalid,
        textarea.invalid,
        select.invalid {
            border-color: #ff6b6b;
            background: #fff5f5;
        }

        input.valid,
        textarea.valid,
        select.valid {
            border-color: #51cf66;
            background: #f1fdf4;
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .char-counter {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }

        .char-counter.warning {
            color: #ff9800;
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .table-section {
            padding: 30px;
        }

        .table-section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 18px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            color: #666;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .btn-delete {
            background: #ff6b6b;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #ff5252;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>STUDENT DETAILS TASK</h1>
        </div>

        <div class="form-section">
            <h2 style="margin-bottom: 20px; color: #333;">STUDENT FORM</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                    <div class="error-msg" id="nameError"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="Enter your age" min="1" max="100" required>
                        <div class="error-msg" id="ageError"></div>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <div style="display: flex; gap: 20px; margin-top: 8px;">
                            <label style="display: flex; align-items: center; font-weight: 400; margin-bottom: 0;">
                                <input type="radio" name="gender" value="Male" required style="margin-right: 8px; width: auto;">
                                Male
                            </label>
                            <label style="display: flex; align-items: center; font-weight: 400; margin-bottom: 0;">
                                <input type="radio" name="gender" value="Female" required style="margin-right: 8px; width: auto;">
                                Female
                            </label>
                        </div>
                        <div class="error-msg" id="genderError"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="">Select a course</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Java">Java</option>
                            <option value="React">React</option>
                            <option value="Django">Django</option>
                        </select>
                        <div class="error-msg" id="courseError"></div>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                        <div class="error-msg" id="emailError"></div>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" id="submitBtn" class="btn-submit" disabled>Save</button>
                </div>
            </form>
        </div>

        <div class="table-section">
            <h2>Student Records</h2>
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('studentForm');
        const nameInput = document.getElementById('name');
        const ageInput = document.getElementById('age');
        const courseSelect = document.getElementById('course');
        const genderInputs = document.querySelectorAll('input[name="gender"]');
        const emailInput = document.getElementById('email');
        const submitBtn = document.getElementById('submitBtn');
        const tableContainer = document.getElementById('tableContainer');

        let students = JSON.parse(localStorage.getItem('students')) || [];

        // Real-time validation functions
        function validateName(name) {
            return name.trim().length > 0;
        }

        function validateAge(age) {
            return age && age > 0 && age <= 100;
        }

        function validateEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }

        function getSelectedGender() {
            return Array.from(genderInputs).find(input => input.checked)?.value;
        }

        function showError(input, message) {
            const errorId = input.id + 'Error';
            const errorElement = document.getElementById(errorId);
            input.classList.add('invalid');
            input.classList.remove('valid');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError(input) {
            const errorId = input.id + 'Error';
            const errorElement = document.getElementById(errorId);
            input.classList.remove('invalid');
            input.classList.add('valid');
            errorElement.classList.remove('show');
        }

        // Name validation
        nameInput.addEventListener('input', (e) => {
            if (validateName(e.target.value)) {
                clearError(nameInput);
            } else {
                showError(nameInput, 'Name cannot be empty');
            }
            updateSubmitBtn();
        });

        // Age validation
        ageInput.addEventListener('input', (e) => {
            if (validateAge(e.target.value)) {
                clearError(ageInput);
            } else {
                showError(ageInput, 'Please enter a valid age (1-100)');
            }
            updateSubmitBtn();
        });

        // Email validation
        emailInput.addEventListener('input', (e) => {
            if (validateEmail(e.target.value)) {
                clearError(emailInput);
            } else {
                showError(emailInput, 'Please enter a valid email address');
            }
            updateSubmitBtn();
        });

        // Course validation
        courseSelect.addEventListener('change', () => {
            updateSubmitBtn();
        });

        // Gender validation
        genderInputs.forEach(input => {
            input.addEventListener('change', () => {
                updateSubmitBtn();
            });
        });

        // Update submit button state
        function updateSubmitBtn() {
            const isNameValid = validateName(nameInput.value);
            const isAgeValid = validateAge(ageInput.value);
            const isEmailValid = validateEmail(emailInput.value);
            const isCourseValid = courseSelect.value !== '';
            const isGenderValid = getSelectedGender() !== undefined;

            submitBtn.disabled = !(isNameValid && isAgeValid && isEmailValid && isCourseValid && isGenderValid);
        }

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const student = {
                id: Date.now(),
                name: nameInput.value,
                age: ageInput.value,
                gender: getSelectedGender(),
                course: courseSelect.value,
                email: emailInput.value
            };

            students.push(student);
            localStorage.setItem('students', JSON.stringify(students));

            form.reset();
            nameInput.classList.remove('valid');
            ageInput.classList.remove('valid');
            emailInput.classList.remove('valid');
            courseSelect.classList.remove('valid');
            submitBtn.disabled = true;

            renderTable();
        });

        // Delete student
        function deleteStudent(id) {
            students = students.filter(s => s.id !== id);
            localStorage.setItem('students', JSON.stringify(students));
            renderTable();
        }

        // Render table
        function renderTable() {
            if (students.length === 0) {
                tableContainer.innerHTML = '<div class="empty-state"><p>No student records yet. Add one above!</p></div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Course</th>
                            <th>Gender</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            students.forEach(student => {
                html += `
                    <tr>
                        <td>${student.name}</td>
                        <td>${student.age}</td>
                        <td>${student.course}</td>
                        <td>${student.gender}</td>
                        <td>${student.email}</td>
                        <td><button type="button" class="btn-delete" onclick="deleteStudent(${student.id})">Delete</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableContainer.innerHTML = html;
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
